    <div id="cap0" class="clip cap" data-start="0.5" data-duration="2.554" data-track-index="1"><span>Here's a listing you might scroll past any day.</span></div><div id="cap1" class="clip cap" data-start="3.2" data-duration="1.771" data-track-index="1"><span>A baby sleeper. Barely used.</span></div><div id="cap2" class="clip cap" data-start="5.021" data-duration="2.397" data-track-index="1"><span>Twenty-five dollars, pickup only.</span></div><div id="cap3" class="clip cap" data-start="7.6" data-duration="2.831" data-track-index="1"><span>It looks perfectly safe. But what if it isn't?</span></div><div id="cap4" class="clip cap" data-start="11.9" data-duration="2.753" data-track-index="1"><span>This is the Fisher-Price Rock 'n Play.</span></div><div id="cap5" class="clip cap" data-start="14.703" data-duration="3.564" data-track-index="1"><span>In 2019 it was recalled, about 4.7 million units,</span></div><div id="cap6" class="clip cap" data-start="18.317" data-duration="2.537" data-track-index="1"><span>after reports of infant deaths.</span></div><div id="cap7" class="clip cap" data-start="21.1" data-duration="4.367" data-track-index="1"><span>Inclined infant sleepers like it are now banned from sale entirely.</span></div><div id="cap8" class="clip cap" data-start="25.7" data-duration="2.451" data-track-index="1"><span>But a recall stops new sales, not resales.</span></div><div id="cap9" class="clip cap" data-start="28.201" data-duration="2.51" data-track-index="1"><span>And this listing never says “Rock 'n Play.”</span></div><div id="cap10" class="clip cap" data-start="30.761" data-duration="1.738" data-track-index="1"><span>It says “sleeper/rocker.”</span></div><div id="cap11" class="clip cap" data-start="32.8" data-duration="3.79" data-track-index="1"><span>This year, Consumer Reports found banned baby gear listed on every</span></div><div id="cap12" class="clip cap" data-start="36.64" data-duration="2.17" data-track-index="1"><span>major resale platform it checked.</span></div><div id="cap13" class="clip cap" data-start="39.7" data-duration="1.637" data-track-index="1"><span>So we built SecondLook.</span></div><div id="cap14" class="clip cap" data-start="41.5" data-duration="3.45" data-track-index="1"><span>A safety check for the moment before you buy something used.</span></div><div id="cap15" class="clip cap" data-start="45.0" data-duration="2.355" data-track-index="1"><span>Paste a listing, or snap the label.</span></div><div id="cap16" class="clip cap" data-start="47.405" data-duration="3.041" data-track-index="1"><span>It checks U.S. recalls and federal sale bans,</span></div><div id="cap17" class="clip cap" data-start="50.496" data-duration="2.861" data-track-index="1"><span>then tells you what to ask the seller.</span></div><div id="cap18" class="clip cap" data-start="54.3" data-duration="3.983" data-track-index="1"><span>Here's that same listing, pasted in exactly as the seller wrote it.</span></div><div id="cap19" class="clip cap" data-start="60.6" data-duration="1.811" data-track-index="1"><span>The verdict: don't buy this.</span></div><div id="cap20" class="clip cap" data-start="62.461" data-duration="4.768" data-track-index="1"><span>Inclined sleepers are banned, and it matches the actual CPSC recall.</span></div><div id="cap21" class="clip cap" data-start="72.4" data-duration="2.783" data-track-index="1"><span>Sellers often send a photo of the label instead.</span></div><div id="cap22" class="clip cap" data-start="75.233" data-duration="2.729" data-track-index="1"><span>SecondLook reads it right in your browser.</span></div><div id="cap23" class="clip cap" data-start="80.6" data-duration="3.599" data-track-index="1"><span>It picks up the brand and the model number, and runs the same check.</span></div><div id="cap24" class="clip cap" data-start="85.4" data-duration="1.592" data-track-index="1"><span>Many recalls are narrower.</span></div><div id="cap25" class="clip cap" data-start="87.042" data-duration="2.539" data-track-index="1"><span>This infant swing matches a 4moms recall,</span></div><div id="cap26" class="clip cap" data-start="89.631" data-duration="2.334" data-track-index="1"><span>but only some models are covered.</span></div><div id="cap27" class="clip cap" data-start="92.2" data-duration="2.438" data-track-index="1"><span>So SecondLook writes the questions for you,</span></div><div id="cap28" class="clip cap" data-start="94.688" data-duration="2.391" data-track-index="1"><span>ready to copy and send to the seller.</span></div><div id="cap29" class="clip cap" data-start="97.6" data-duration="3.045" data-track-index="1"><span>And it shows exactly which models the notice covers.</span></div><div id="cap30" class="clip cap" data-start="102.0" data-duration="2.553" data-track-index="1"><span>For thrift stores and donation drives,</span></div><div id="cap31" class="clip cap" data-start="104.603" data-duration="4.772" data-track-index="1"><span>batch mode screens a whole intake list at once, and exports a CSV.</span></div><div id="cap32" class="clip cap" data-start="112.1" data-duration="4.38" data-track-index="1"><span>Under the hood: 7,192 CPSC recalls, indexed,</span></div><div id="cap33" class="clip cap" data-start="116.53" data-duration="5.889" data-track-index="1"><span>plus newer recalls pulled live from the public CPSC API.</span></div><div id="cap34" class="clip cap" data-start="122.7" data-duration="3.816" data-track-index="1"><span>A matching engine translates listing slang into recall language,</span></div><div id="cap35" class="clip cap" data-start="126.566" data-duration="2.848" data-track-index="1"><span>resolves brands, and matches model numbers.</span></div><div id="cap36" class="clip cap" data-start="129.7" data-duration="3.692" data-track-index="1"><span>Federal bans are explicit rules with legal citations.</span></div><div id="cap37" class="clip cap" data-start="133.442" data-duration="3.903" data-track-index="1"><span>The live app runs entirely on this deterministic engine,</span></div><div id="cap38" class="clip cap" data-start="137.395" data-duration="3.286" data-track-index="1"><span>and every match links back to its evidence.</span></div><div id="cap39" class="clip cap" data-start="141.6" data-duration="3.173" data-track-index="1"><span>Before you buy it. Before you sell it. Look twice.</span></div><div id="cap40" class="clip cap" data-start="146.9" data-duration="2.213" data-track-index="1"><span>SecondLook. Free, and live today.</span></div>
